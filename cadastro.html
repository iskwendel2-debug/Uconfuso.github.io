<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="pagina-login">
    <div class="caixa-login">
        <h1>Criar Nova Conta ✨</h1>
        
        <form id="formCadastro" class="form-login">
            <input type="text" id="nome" placeholder="Seu nome completo" required>
            <input type="email" id="emailCadastro" placeholder="Seu e-mail" required>
            <input type="password" id="senhaCadastro" placeholder="Crie uma senha (mínimo 6 dígitos)" required>
            <button type="submit" class="botao">Criar Conta</button>
        </form>

        <p id="sucessoCad" class="sucesso oculto">✅ Conta criada! Entrando...</p>
        <p id="erroCad" class="erro oculto"></p>
        
        <p class="aviso">Já tem conta? <a href="login.html">Faça login</a></p>
        <a href="index.html" class="voltar">← Voltar ao site</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="cadastro.js"></script>
</body>
</html>
