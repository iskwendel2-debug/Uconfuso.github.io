<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        firebase.auth().onAuthStateChanged(async (usuario) => {
            console.log("Usuário logado:", usuario); // Ajuda a verificar
            
            if (!usuario) {
                alert("Você precisa fazer login!");
                window.location.href = 'login.html';
                return;
            }

            console.log("Seu e-mail:", usuario.email);
            console.log("E-mail de admin:", adminEmail);

            if (usuario.email !== adminEmail) {
                alert("⛔ ACESSO NEGADO!\nSeu e-mail: " + usuario.email + "\nAdmin: " + adminEmail);
                window.location.href = 'index.html';
                return;
            }

            // SE CHEGOU AQUI → É ADMIN! ✅
            document.getElementById('painelAdmin').style.display = 'block';
            document.getElementById('nomeAdmin').textContent = usuario.displayName || usuario.email;

            const db = firebase.firestore();
            
            // Carregar aviso
            try {
                const aviso = await db.collection('config').doc('aviso').get();
                if (aviso.exists) {
                    document.getElementById('textoAviso').value = aviso.data().texto || '';
                }
            } catch(e) {
                console.log("Sem aviso salvo");
            }
        });

        async function salvarAviso() {
            const texto = document.getElementById('textoAviso').value;
            try {
                await firebase.firestore().collection('config').doc('aviso').set({
                    texto: texto
                });
                alert("✅ Salvo!");
            } catch(e) {
                alert("Erro: " + e.message);
            }
        }
        async function apagarAviso() {
    if (confirm('Tem certeza que quer apagar o aviso?')) {
        try {
            await firebase.firestore().collection('config').doc('aviso').delete();
            document.getElementById('textoAviso').value = '';
            alert('✅ Aviso removido!');
        } catch(e) {
            alert('Erro: ' + e.message);
        }
    }
}

        function sair() {
            firebase.auth().signOut().then(() => {
                window.location.href = 'index.html';
            });
        }
    </script>

    <header>
        <nav class="navegacao">
            <a href="index.html" class="logo">Painel Admin</a>
            <button onclick="sair()" class="botao">Sair</button>
        </nav>
    </header>

    <main id="painelAdmin" class="secao" style="padding-top: 8rem; display: none;">
        <h1>Bem-vindo, <span id="nomeAdmin"></span>! 🔐</h1>
        <hr>

        <h2>✏️ Escrever Aviso</h2>
        <textarea id="textoAviso" placeholder="Seu aviso aqui..." style="width:100%; min-height:120px; padding:0.8rem; margin:0.5rem 0;"></textarea>
        <br>
        <button onclick="salvarAviso()" class="botao">💾 Salvar</button>
        <button onclick="apagarAviso()" class="botao" style="background:#ff4444;">🗑️ Apagar Aviso</button>
    </main>
</body>
</html>
