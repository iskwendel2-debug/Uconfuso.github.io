<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // Verifica se está logado E se é admin
        firebase.auth().onAuthStateChanged(usuario => {
            if (!usuario) {
                window.location.href = 'login.html'; // sem conta → vai pro login
            } else if (usuario.email !== adminEmail) {
                alert('⛔ Acesso negado! Apenas o administrador pode entrar.');
                window.location.href = 'index.html'; // tem conta mas não é admin → volta pro início
            } else {
                // É admin → mostra o painel
                document.getElementById('painelAdmin').style.display = 'block';
                document.getElementById('nomeAdmin').textContent = usuario.displayName || usuario.email;
            }
        });

        // Função de sair
        function sair() {
            firebase.auth().signOut().then(() => {
                window.location.href = 'index.html';
            });
        }
    </script>

    <header>
        <nav class="navegacao">
            <a href="index.html" class="logo">Painel Admin</a>
            <button onclick="sair()" class="botao">Sair</button>
        </nav>
    </header>

    <main id="painelAdmin" class="secao" style="padding-top: 8rem; display: none;">
        <h1>Bem-vindo, <span id="nomeAdmin"></span>! 🔐</h1>
        <p>Essa página só você consegue ver e editar ✅</p>
        <hr>

        <h2>✏️ Área de Edição</h2>
        <p>Aqui você coloca o que quiser controlar:</p>

        <!-- Exemplo de conteúdo que você edita -->
        <div style="background:#f5f5f5; padding:1.5rem; border-radius:8px; margin:1rem 0;">
            <h3>📌 Avisos do Site</h3>
            <textarea placeholder="Escreva um aviso que aparecerá no site..." style="width:100%; min-height:100px; padding:0.8rem; margin:0.5rem 0; border-radius:4px; border:1px solid #ccc;"></textarea>
            <button class="botao">Salvar Aviso</button>
        </div>

        <div style="background:#f5f5f5; padding:1.5rem; border-radius:8px; margin:1rem 0;">
            <h3>📊 Estatísticas</h3>
            <p>Total de contas criadas: <strong id="totalUsuarios">0</strong></p>
            <p>Último acesso: <strong id="ultimoAcesso">-</strong></p>
        </div>

        <p style="margin-top: 2rem;">💡 <strong>Só você vê isso!</strong> Nenhum outro usuário tem acesso a esta página.</p>
    </main>
</body>
</html>
