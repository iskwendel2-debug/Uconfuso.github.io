<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        .tabela-usuarios {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .tabela-usuarios th, .tabela-usuarios td {
            padding: 0.8rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .tabela-usuarios th {
            background: #f5f5f5;
        }
        .botao-excluir {
            background: #ff4444;
            padding: 0.4rem 0.8rem;
            font-size: 0.9rem;
        }
        .aba {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-right: 0.5rem;
        }
        .aba.ativa {
            border-bottom: 3px solid #2196F3;
            color: #2196F3;
            font-weight: bold;
        }
        .conteudo-aba {
            display: none;
            padding: 1rem 0;
        }
        .conteudo-aba.mostrar {
            display: block;
        }
        .grupo-campo {
            margin-bottom: 1rem;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 0.3rem;
        }
        input, textarea {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        firebase.auth().onAuthStateChanged(async (usuario) => {
            if (!usuario) {
                window.location.href = 'login.html';
                return;
            }
            if (usuario.email !== adminEmail) {
                alert('⛔ Acesso negado!');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('painelAdmin').style.display = 'block';
            document.getElementById('nomeAdmin').textContent = usuario.displayName || usuario.email;

            carregarAviso();
            carregarTextosSite();
            await carregarUsuarios();
        });

        function mudarAba(nomeAba) {
            document.querySelectorAll('.aba').forEach(aba => aba.classList.remove('ativa'));
            document.querySelectorAll('.conteudo-aba').forEach(c => c.classList.remove('mostrar'));
            
            event.target.classList.add('ativa');
            document.getElementById(nomeAba).classList.add('mostrar');
        }

        // ===== AVISOS =====
        async function carregarAviso() {
            const snap = await firebase.firestore().collection('config').doc('aviso').get();
            if (snap.exists) {
                document.getElementById('textoAviso').value = snap.data().texto || '';
            }
        }

        async function salvarAviso() {
            const texto = document.getElementById('textoAviso').value;
            try {
                await firebase.firestore().collection('config').doc('aviso').set({ texto: texto });
                alert('✅ Aviso salvo!');
            } catch(e) {
                alert('❌ Erro: ' + e.message);
            }
        }

        async function apagarAviso() {
            if (confirm('Tem certeza?')) {
                try {
                    await firebase.firestore().collection('config').doc('aviso').delete();
                    document.getElementById('textoAviso').value = '';
                    alert('✅ Aviso removido!');
                } catch(e) {
                    alert('❌ Erro: ' + e.message);
                }
            }
        }

        // ===== EDITAR TEXTOS DO SITE =====
        async function carregarTextosSite() {
            const snap = await firebase.firestore().collection('config').doc('textosSite').get();
            if (snap.exists) {
                const dados = snap.data();
                document.getElementById('tituloInicio').value = dados.tituloInicio || '';
                document.getElementById('descricaoInicio').value = dados.descricaoInicio || '';
                document.getElementById('slogan').value = dados.slogan || '';
            }
        }

        async function salvarTextosSite() {
            const titulo = document.getElementById('tituloInicio').value;
            const descricao = document.getElementById('descricaoInicio').value;
            const slogan = document.getElementById('slogan').value;

            try {
                await firebase.firestore().collection('config').doc('textosSite').set({
                    tituloInicio: titulo,
                    descricaoInicio: descricao,
                    slogan: slogan,
                    atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('✅ Textos do site atualizados!');
            } catch(e) {
                alert('❌ Erro: ' + e.message);
            }
        }

        // ===== USUÁRIOS =====
        async function carregarUsuarios() {
            const lista = document.getElementById('listaUsuarios');
            lista.innerHTML = '<p>Carregando...</p>';

            try {
                const snap = await firebase.firestore().collection('usuarios').get();
                lista.innerHTML = '';

                if (snap.empty) {
                    lista.innerHTML = '<p>Nenhum usuário cadastrado ainda.</p>';
                    document.getElementById('totalUsuarios').textContent = '0';
                    return;
                }

                snap.forEach(doc => {
                    const u = doc.data();
                    const data = u.dataCadastro ? new Date(u.dataCadastro.toDate()).toLocaleString('pt-BR') : '-';
                    
                    lista.innerHTML += `
                        <tr>
                            <td>${u.nome || 'Sem nome'}</td>
                            <td>${u.email || '-'}</td>
                            <td>${data}</td>
                            <td>
                                <button class="botao botao-excluir" onclick="excluirUsuario('${doc.id}')">Excluir</button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('totalUsuarios').textContent = snap.size;
            } catch(e) {
                lista.innerHTML = `<p style="color:red">Erro ao carregar: ${e.message}</p>`;
            }
        }

        async function excluirUsuario(uid) {
            if (!confirm('Tem certeza que quer EXCLUIR esse usuário?\nEsta ação não pode ser desfeita!')) return;
            
            try {
                await firebase.firestore().collection('usuarios').doc(uid).delete();
                alert('✅ Usuário excluído!');
                await carregarUsuarios();
            } catch(e) {
                alert('❌ Erro: ' + e.message);
            }
        }

        function sair() {
            firebase.auth().signOut().then(() => {
                window.location.href = 'index.html';
            });
        }
    </script>

    <header>
        <nav class="navegacao">
            <a href="index.html" class="logo">Painel Admin</a>
            <button onclick="sair()" class="botao">Sair</button>
        </nav>
    </header>

    <main id="painelAdmin" class="secao" style="padding-top: 6rem; display: none;">
        <h1>Bem-vindo, <span id="nomeAdmin"></span>! 🔐</h1>
        <hr>

        <div>
            <span class="aba ativa" onclick="mudarAba('abaAvisos')">📢 Avisos</span>
            <span class="aba" onclick="mudarAba('abaTextos')">✏️ Editar Site</span>
            <span class="aba" onclick="mudarAba('abaUsuarios')">👥 Usuários</span>
        </div>

        <!-- ABA AVISOS -->
        <div id="abaAvisos" class="conteudo-aba mostrar">
            <h2>📢 Gerenciar Avisos</h2>
            <textarea id="textoAviso" placeholder="Digite o aviso..." style="width:100%; min-height:120px; padding:0.8rem; margin:0.5rem 0;"></textarea>
            <br>
            <button onclick="salvarAviso()" class="botao">💾 Salvar</button>
            <button onclick="apagarAviso()" class="botao" style="background:#ff4444;">🗑️ Apagar</button>
        </div>

        <!-- ABA EDITAR TEXTOS -->
        <div id="abaTextos" class="conteudo-aba">
            <h2>✏️ Editar Textos do Site</h2>
            <p>Altere os textos abaixo e clique em Salvar para atualizar a página inicial!</p>
            <hr>

            <div class="grupo-campo">
                <label>Título Principal:</label>
                <input type="text" id="tituloInicio" placeholder="Ex: Bem-vindo ao Meu Site!">
            </div>

            <div class="grupo-campo">
                <label>Slogan / Frase abaixo do título:</label>
                <input type="text" id="slogan" placeholder="Ex: O melhor lugar pra você!">
            </div>

            <div class="grupo-campo">
                <label>Descrição / Apresentação:</label>
                <textarea id="descricaoInicio" placeholder="Conte um pouco sobre o site..." style="min-height:100px;"></textarea>
            </div>

            <button onclick="salvarTextosSite()" class="botao">💾 Salvar Alterações</button>
        </div>

        <!-- ABA USUÁRIOS -->
        <div id="abaUsuarios" class="conteudo-aba">
            <h2>👥 Lista de Usuários</h2>
            <p>Total de contas criadas: <strong id="totalUsuarios">0</strong></p>
            
            <table class="tabela-usuarios">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Data de Cadastro</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="listaUsuarios"></tbody>
            </table>
        </div>
    </main>
</body>
</html>
